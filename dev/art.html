<!doctype html>
<html>
<head><meta charset="utf-8"><title>Art preview</title>
<style>body{margin:0;background:#120d16;color:#eee;font:12px monospace} canvas{image-rendering:pixelated}</style></head>
<body>
<canvas id="sheet"></canvas>
<script type="module">
import { buildBank } from '../src/game/art/bank.ts';
import { roomPreview, ROOM_LOOK } from '../src/game/art/topdown.ts';
const bank = buildBank();
const S = 3;
const c = document.getElementById('sheet');
c.width = 1500; c.height = 2000;
const ctx = c.getContext('2d');
ctx.imageSmoothingEnabled = false;
ctx.fillStyle = '#120d16'; ctx.fillRect(0,0,c.width,c.height);
let x = 10, y = 10, rowH = 0;
for (const [name, img] of bank) {
  const w = img.width * S, h = img.height * S;
  if (x + w > c.width - 10) { x = 10; y += rowH + 18; rowH = 0; }
  ctx.fillStyle = '#2a2030'; ctx.fillRect(x, y, w, h);
  ctx.drawImage(img, x, y, w, h);
  ctx.fillStyle = '#aaa'; ctx.fillText(name, x, y + h + 11);
  x += Math.max(w, ctx.measureText(name).width) + 12; rowH = Math.max(rowH, h);
}
y += rowH + 30; x = 10; rowH = 0;
for (const look of Object.keys(ROOM_LOOK)) {
  const img = roomPreview(bank, look);
  const w = img.width * 2, h = img.height * 2;
  if (x + w > c.width - 10) { x = 10; y += rowH + 18; rowH = 0; }
  ctx.drawImage(img, x, y, w, h);
  ctx.fillStyle = '#aaa'; ctx.fillText(look, x, y + h + 11);
  x += w + 12; rowH = Math.max(rowH, h);
}
document.title = 'ready';
</script>
</body></html>
